name: Go CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7.0.1

            - name: Setup Go
              uses: actions/setup-go@v7.1.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run Tests
              run: go test ./...

            - name: Run vet
              run: go vet ./...
